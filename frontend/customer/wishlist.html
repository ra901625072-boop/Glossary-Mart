<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Saved Wishlist &bull; e Grossary</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="View and manage your favorite groceries, fresh produce, and staple items saved for express re-ordering.">
    <meta name="theme-color" content="#059669">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.png">
    <link rel="shortcut icon" href="../static/images/favicon.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../static/css/core/variables.css">
    <link rel="stylesheet" href="../static/css/customer.css">
    <!-- Immediate Authentication Guard -->
    <script>
        (function() {
            try {
                var user = JSON.parse(localStorage.getItem('jg_auth_user') || 'null');
                if (!user || !user.id || user.role !== 'customer') {
                    document.documentElement.style.display = 'none';
                    window.location.replace('../auth/login.html?redirect=wishlist.html');
                }
            } catch (e) {
                document.documentElement.style.display = 'none';
                window.location.replace('../auth/login.html?redirect=wishlist.html');
            }
        })();
    </script>
</head>
<body data-page="wishlist">

    <!-- Unified Master Customer Header -->
    <div data-component="customer-header"></div>


    <!-- Main Container -->
    <main class="container my-3 my-md-4">
        <!-- VIEW: WISHLIST -->
        <section id="view-wishlist" class="app-view active-view">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 fw-bold mb-1 brand-font text-dark">My Saved Wishlist</h1>
                    <p class="text-muted small mb-0">Items you love and want to buy regularly</p>
                </div>
                <a href="shop.html" class="btn btn-sm btn-outline-success rounded-pill px-3">
                    <i class="bi bi-grid me-1"></i>Browse Catalog
                </a>
            </div>

            <div id="wishlistEmptyState" class="text-center py-5" style="display: none;">
                <i class="bi bi-heartbreak display-1 text-muted opacity-50 mb-3 d-block"></i>
                <h4 class="fw-bold text-dark mb-1">Your Wishlist is Empty</h4>
                <p class="text-muted small mb-4">Save fresh fruits, dairy, and household items here for quick re-ordering.</p>
                <a href="shop.html" class="btn btn-success rounded-pill px-4 py-2 fw-bold">
                    <i class="bi bi-cart-plus me-1"></i> Explore Products
                </a>
            </div>

            <div class="row g-3 g-md-4" id="wishlistGrid">
                <!-- Dynamically populated by customer.js -->
            </div>
        </section>
    </main>

    <!-- Quick View Modal -->
    <div class="modal fade" id="quickViewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border-0 shadow-lg overflow-hidden">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-0 p-4">
                    <div class="row g-4 align-items-center">
                        <div class="col-md-5 text-center">
                            <img id="quickViewImg" src="" alt="Product" class="img-fluid rounded-4 shadow-sm" style="max-height: 280px; object-fit: contain;">
                        </div>
                        <div class="col-md-7">
                            <span class="badge bg-success-subtle text-success px-3 py-1 rounded-pill fw-bold mb-2">
                                ⏱️ 15-Minute Delivery
                            </span>
                            <h3 class="fw-bold brand-font text-dark mb-1" id="quickViewTitle">Product Name</h3>
                            <div class="small text-muted mb-2" id="quickViewUnit">1 kg</div>
                            <div class="small text-warning fw-bold mb-3" id="quickViewRating">4.8 ★</div>

                            <div class="d-flex align-items-baseline gap-2 mb-3">
                                <span class="h3 fw-bold text-success mb-0" id="quickViewPrice">₹0</span>
                                <span class="text-muted text-decoration-line-through small" id="quickViewMrp">₹0</span>
                            </div>

                            <p class="text-muted small mb-4" id="quickViewDesc">
                                High quality grocery item freshly sourced.
                            </p>

                            <div class="d-flex gap-3">
                                <button class="btn btn-success flex-fill py-2 rounded-pill fw-bold" id="quickViewAddBtn">
                                    <i class="bi bi-cart-plus me-1"></i> Add to Bag
                                </button>
                                <button class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">
                                    Close
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Slide-over Offcanvas Cart Drawer -->
    <div data-component="cart-drawer"></div>

    <!-- Master Footer -->
    <div data-component="customer-footer"></div>

    <!-- Mobile Sticky Bottom Touch Bar -->
    <div data-component="mobile-bottom-nav"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/api-config.js"></script>
    <script src="../static/js/core/utils.js"></script>
    <script src="../static/js/core/component-loader.js"></script>
    <script src="../static/js/services/auth.service.js"></script>
    <script src="../static/js/services/cart.service.js"></script>
    <script src="../static/js/services/order.service.js"></script>
    <script src="../static/js/customer.js"></script>
</body>
</html>
