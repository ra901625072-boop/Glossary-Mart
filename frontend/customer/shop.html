<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grocery Catalog &bull; e Grossary</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Explore fresh fruits, vegetables, dairy, atta, snacks, and household essentials at e Grossary. 15-minute doorstep delivery.">
    <meta name="theme-color" content="#059669">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.png">
    <link rel="shortcut icon" href="../static/images/favicon.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../static/css/core/variables.css">
    <link rel="stylesheet" href="../static/css/customer.css">
</head>
<body data-page="shop">

    <!-- Unified Master Customer Header -->
    <div data-component="customer-header"></div>


    <!-- Main Dynamic Application Container -->
    <main class="container my-3 my-md-4">
        <!-- VIEW: SHOP & PRODUCT CATALOG -->
        <section id="view-shop" class="app-view active-view">
            <!-- Category Filter Carousel (Clean, Single Row) -->
            <div class="category-filter-nav mb-3">
                <button class="cat-pill-btn active" data-category="all" onclick="window.JG.filterCategory('all')">
                    <i class="bi bi-grid me-1"></i>All Products
                </button>
                <button class="cat-pill-btn" data-category="vegetables" onclick="window.JG.filterCategory('vegetables')">
                    Vegetables &amp; Fruits
                </button>
                <button class="cat-pill-btn" data-category="dairy" onclick="window.JG.filterCategory('dairy')">
                    Dairy &amp; Breakfast
                </button>
                <button class="cat-pill-btn" data-category="staples" onclick="window.JG.filterCategory('staples')">
                    Atta, Rice &amp; Dal
                </button>
                <button class="cat-pill-btn" data-category="snacks" onclick="window.JG.filterCategory('snacks')">
                    Snacks &amp; Munchies
                </button>
                <button class="cat-pill-btn" data-category="beverages" onclick="window.JG.filterCategory('beverages')">
                    Beverages &amp; Juices
                </button>
                <button class="cat-pill-btn" data-category="spices" onclick="window.JG.filterCategory('spices')">
                    Masala &amp; Spices
                </button>
                <button class="cat-pill-btn" data-category="cleaning" onclick="window.JG.filterCategory('cleaning')">
                    Cleaning &amp; Household
                </button>
            </div>

            <!-- Subheader / Toolbar -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 border" style="border-color: var(--border-subtle) !important;">
                <div>
                    <h2 class="h5 fw-bold text-dark mb-0 brand-font">Everyday Grocery Essentials</h2>
                    <span class="smallest text-muted" id="catalogCountLabel">Showing all products</span>
                </div>
                <div class="d-flex align-items-center gap-2 mt-2 mt-sm-0">
                    <label class="small text-muted fw-bold mb-0">Sort by:</label>
                    <select class="form-select form-select-sm rounded-pill" style="width: 170px;" onchange="window.JG.handleSortChange(this.value)">
                        <option value="popularity">Most Popular</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Customer Rating</option>
                        <option value="discount">Biggest Discount</option>
                    </select>
                </div>
            </div>

            <!-- Products Grid Container -->
            <div class="row g-3 g-md-4" id="productsGrid">
                <!-- Dynamically populated by customer.js -->
            </div>
        </section>
    </main>

    <!-- MODAL 1: PRODUCT QUICK VIEW MODAL -->
    <div class="modal fade" id="quickViewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border-0 shadow-lg overflow-hidden">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-0 p-4">
                    <div class="row g-4 align-items-center">
                        <div class="col-md-5 text-center">
                            <img id="quickViewImg" src="" alt="Product" class="img-fluid rounded-4 shadow-sm" style="max-height: 280px; object-fit: contain;">
                        </div>
                        <div class="col-md-7">
                            <span class="badge bg-success-subtle text-success px-3 py-1 rounded-pill fw-bold mb-2">
                                ⏱️ 15-Minute Delivery
                            </span>
                            <h3 class="fw-bold brand-font text-dark mb-1" id="quickViewTitle">Product Name</h3>
                            <div class="small text-muted mb-2" id="quickViewUnit">1 kg</div>
                            <div class="small text-warning fw-bold mb-3" id="quickViewRating">4.8 ★</div>

                            <div class="d-flex align-items-baseline gap-2 mb-3">
                                <span class="h3 fw-bold text-success mb-0" id="quickViewPrice">₹0</span>
                                <span class="text-muted text-decoration-line-through small" id="quickViewMrp">₹0</span>
                            </div>

                            <p class="text-muted small mb-4" id="quickViewDesc">
                                High quality grocery item freshly sourced.
                            </p>

                            <div class="d-flex flex-wrap gap-2">
                                <button class="btn btn-outline-success flex-fill py-2 rounded-pill fw-bold" id="quickViewAddBtn">
                                    <i class="bi bi-cart-plus me-1"></i> Add to Bag
                                </button>
                                <button class="btn btn-success flex-fill py-2 rounded-pill fw-bold" id="quickViewBuyBtn">
                                    <i class="bi bi-lightning-charge-fill me-1"></i> Buy Now
                                </button>
                                <a href="#" class="btn btn-light border flex-fill py-2 rounded-pill fw-bold text-dark" id="quickViewDetailsLink">
                                    <i class="bi bi-box-arrow-up-right me-1"></i> Details
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Slide-over Offcanvas Cart Drawer -->
    <div data-component="cart-drawer"></div>

    <!-- Master Customer Footer -->
    <div data-component="customer-footer"></div>

    <!-- Mobile Sticky Bottom Touch Bar -->
    <div data-component="mobile-bottom-nav"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/api-config.js"></script>
    <script src="../static/js/core/utils.js"></script>
    <script src="../static/js/core/component-loader.js"></script>
    <script src="../static/js/services/auth.service.js"></script>
    <script src="../static/js/services/cart.service.js"></script>
    <script src="../static/js/services/order.service.js"></script>
    <script src="../static/js/customer.js"></script>
</body>
</html>
