<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recover Password &bull; e Grossary</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Reset your e Grossary account password securely.">
    <meta name="theme-color" content="#10b981">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.png">
    <link rel="shortcut icon" href="../static/images/favicon.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../static/css/core/variables.css">
    <link rel="stylesheet" href="../static/css/customer.css">
    <link rel="stylesheet" href="../static/css/homepage.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--color-background);
            background-image: var(--bg-canvas-full);
            background-size: var(--bg-canvas-pattern-size), auto;
            background-attachment: fixed;
            background-repeat: repeat, no-repeat;
            color: var(--color-text-primary);
        }
        .auth-container {
            max-width: 460px;
            width: 100%;
            margin: auto;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl, 24px);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--color-border-subtle);
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
            transition: box-shadow var(--duration-normal) var(--ease-out);
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--specular-highlight);
            pointer-events: none;
        }
        .auth-brand-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
        .btn-auth-submit {
            background: var(--gradient-brand);
            color: #ffffff !important;
            border: none;
            box-shadow: var(--shadow-sm);
            transition: all var(--duration-fast) var(--ease-out);
        }
        .btn-auth-submit:hover {
            box-shadow: var(--glow-cta-hover);
            transform: translateY(-1px);
        }
        .btn-auth-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                <img src="../static/images/logo-icon.png" alt="e Grossary Logo" class="auth-brand-logo">
                <div class="text-start">
                    <span class="brand-title" style="font-family: 'Outfit', sans-serif; font-size: 1.45rem; font-weight: 800; color: var(--color-text-primary); line-height: 1.1; display: block;">e<span style="color: var(--primary, #059669);">Grossary</span></span>
                    <span class="brand-tagline" style="font-size: 0.65rem; font-weight: 700; color: var(--primary, #059669); letter-spacing: 0.08em; text-transform: uppercase;">Fresh Groceries Superstore</span>
                </div>
            </a>
        </div>

        <!-- Forgot Password Card -->
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="rounded-circle bg-success bg-opacity-10 text-success d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-key-fill fs-3"></i>
                </div>
                <h3 class="fw-bold brand-font text-dark mb-1">Reset Password</h3>
                <p class="small text-muted mb-0">Enter your registered email address and we'll send you an instant reset link</p>
            </div>

            <div id="forgotFeedback"></div>

            <form onsubmit="handleForgotPassword(event)">
                <div class="auth-input-group mb-4">
                    <i class="bi bi-envelope auth-icon"></i>
                    <input type="email" class="form-control" id="forgotEmail" placeholder="Enter your registered email" required>
                </div>
                <button type="submit" class="btn-auth-submit w-100 py-3 rounded-pill fw-bold">
                    <i class="bi bi-send me-1"></i>
                    <span>Send Reset Instructions</span>
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top small text-muted">
                Remember your password? <a href="login.html" class="text-success fw-bold text-decoration-none">Return to Sign In</a>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-3">
            <a href="../index.html" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Storefront Home
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/api-config.js"></script>
    <script src="../static/js/core/utils.js"></script>
    <script src="../static/js/services/auth.service.js"></script>
    <script src="../static/js/homepage.js"></script>
</body>
</html>
