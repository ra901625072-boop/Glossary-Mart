<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account &bull; e Grossary</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Join e Grossary for fresh grocery delivery, exclusive coupons, and express doorstep dispatch.">
    <meta name="theme-color" content="#10b981">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/images/favicon.png">
    <link rel="shortcut icon" href="../static/images/favicon.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../static/css/core/variables.css">
    <link rel="stylesheet" href="../static/css/homepage.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #ecfdf5 100%);
        }
        .auth-container {
            max-width: 520px;
            width: 100%;
            margin: auto;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 2.5rem 2rem;
        }
        .auth-brand-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                <img src="../static/images/logo-icon.png" alt="e Grossary Logo" class="auth-brand-logo">
                <div class="text-start">
                    <span class="fs-4 fw-bold text-dark font-monospace d-block" style="line-height: 1.1;">e<span class="text-success">Grossary</span></span>
                    <span class="smallest text-muted fw-semibold">Fresh Groceries Superstore</span>
                </div>
            </a>
        </div>

        <!-- Registration Card -->
        <div class="auth-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold brand-font text-dark mb-1">Create Account</h3>
                <p class="small text-muted mb-0">Get started with 15-min delivery and ₹250 welcome credits</p>
            </div>

            <div id="registerFeedback"></div>

            <form onsubmit="handleCustomerRegister(event)">
                <div class="auth-input-group mb-3">
                    <i class="bi bi-person auth-icon"></i>
                    <input type="text" class="form-control" id="regName" placeholder="Full Name (e.g. Rahul Sharma)" required>
                </div>
                <div class="auth-input-group mb-3">
                    <i class="bi bi-envelope auth-icon"></i>
                    <input type="email" class="form-control" id="regEmail" placeholder="Email Address" required>
                </div>
                <div class="auth-input-group mb-3">
                    <i class="bi bi-telephone auth-icon"></i>
                    <input type="tel" class="form-control" id="regPhone" placeholder="Mobile Number (10 digits)" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <div class="auth-input-group">
                            <i class="bi bi-lock auth-icon"></i>
                            <input type="password" class="form-control" id="regPassword" placeholder="Password" required>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="auth-input-group">
                            <i class="bi bi-shield-check auth-icon"></i>
                            <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm" required>
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="small text-muted d-flex align-items-center gap-2 cursor-pointer mb-0">
                        <input type="checkbox" required checked class="form-check-input mt-0">
                        <span>I agree to the <a href="#" class="text-success text-decoration-none">Terms</a> &amp; <a href="#" class="text-success text-decoration-none">Privacy Policy</a></span>
                    </label>
                </div>
                <button type="submit" class="btn-auth-submit w-100 py-3 rounded-pill fw-bold">
                    <i class="bi bi-person-plus me-1"></i>
                    <span>Create Free Account</span>
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top small text-muted">
                Already have an account? <a href="login.html" class="text-success fw-bold text-decoration-none">Sign In here</a>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-3">
            <a href="../index.html" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Storefront Home
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/api-config.js"></script>
    <script src="../static/js/core/utils.js"></script>
    <script src="../static/js/services/auth.service.js"></script>
    <script src="../static/js/homepage.js"></script>
</body>
</html>
