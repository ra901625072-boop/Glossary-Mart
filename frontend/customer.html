<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to e Grossary Customer Portal...</title>
    <meta http-equiv="refresh" content="0; url=customer/shop.html">
    <script>
        (function () {
            var rawHash = (window.location.hash || '').replace('#', '').split('?')[0].trim().toLowerCase();
            var search = window.location.search || '';
            var routeMap = {
                'shop': 'customer/shop.html',
                'product': 'customer/product.html',
                'cart': 'customer/cart.html',
                'checkout': 'customer/checkout.html',
                'payment': 'customer/payment.html',
                'order-confirmation': 'customer/order-confirmation.html',
                'orders': 'customer/orders.html',
                'wishlist': 'customer/wishlist.html',
                'profile': 'customer/profile.html',
                'about': 'customer/about.html',
                'contact': 'customer/contact.html',
                'faq': 'customer/faq.html',
                'terms': 'customer/terms.html'
            };
            var protectedPages = ['checkout', 'payment', 'order-confirmation', 'orders', 'wishlist', 'profile'];
            if (protectedPages.indexOf(rawHash) !== -1) {
                try {
                    var user = JSON.parse(localStorage.getItem('jg_auth_user') || 'null');
                    if (!user || !user.id || user.role !== 'customer') {
                        var targetParam = 'customer/' + rawHash + '.html' + (search ? '&' + search.substring(1) : '');
                        window.location.replace('auth/login.html?redirect=' + encodeURIComponent(targetParam));
                        return;
                    }
                } catch (e) {
                    var targetParam = 'customer/' + rawHash + '.html' + (search ? '&' + search.substring(1) : '');
                    window.location.replace('auth/login.html?redirect=' + encodeURIComponent(targetParam));
                    return;
                }
            }
            var target = routeMap[rawHash] || 'customer/shop.html';
            window.location.replace(target + search);
        })();
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8fafc; color: #334155; margin: 0; }
        .redirect-box { text-align: center; padding: 2rem; }
        .spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h3>Redirecting to e Grossary...</h3>
        <p>If you are not redirected automatically, <a href="customer/shop.html" style="color: #059669; font-weight: bold;">click here</a>.</p>
    </div>
</body>
</html>
