<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to e Grossary ERP Console...</title>
    <meta http-equiv="refresh" content="0; url=admin/index.html">
    <script>
        (function () {
            var rawHash = (window.location.hash || '').replace('#', '').split('?')[0].trim().toLowerCase();
            var search = window.location.search || '';
            var routeMap = {
                'dashboard': 'admin/index.html',
                'pos': 'admin/pos.html',
                'products': 'admin/products.html',
                'categories': 'admin/categories.html',
                'orders': 'admin/orders.html',
                'customers': 'admin/customers.html',
                'sales': 'admin/sales.html',
                'purchases': 'admin/purchases.html',
                'suppliers': 'admin/suppliers.html',
                'coupons': 'admin/coupons.html',
                'activity': 'admin/activity.html',
                'security': 'admin/security.html'
            };
            var target = routeMap[rawHash] || 'admin/index.html';
            window.location.replace(target + search);
        })();
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #f8fafc; margin: 0; }
        .redirect-box { text-align: center; padding: 2rem; }
        .spinner { width: 36px; height: 36px; border: 3px solid #334155; border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h3>Redirecting to e Grossary ERP...</h3>
        <p>If you are not redirected automatically, <a href="admin/index.html" style="color: #10b981; font-weight: bold;">click here</a>.</p>
    </div>
</body>
</html>
