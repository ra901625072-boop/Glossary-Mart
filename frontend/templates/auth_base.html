<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Jay Goga Mart Store{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Design Tokens & Unified Global Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Responsive Design System Adapters -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}" media="(max-width: 599px)">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tablet.css') }}" media="(min-width: 600px) and (max-width: 1023px)">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/desktop.css') }}" media="(min-width: 1024px)">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customer/auth.css') }}">

    <!-- Theme Script (Prevents FOUC) -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background-color: var(--bg-main); }
        .auth-page-root {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            min-height: 100vh;
            background: var(--bg-main);
            position: relative;
        }
        .auth-page-root::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 25% 25%, rgba(var(--primary-rgb), 0.12) 0%, transparent 60%),
                        radial-gradient(ellipse at 75% 75%, rgba(var(--primary-rgb), 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .auth-page-root > .auth-inner { position: relative; z-index: 1; width: 100%; }
    </style>
</head>

<body>
    <div class="app-shell">
        {% include 'partials/_toasts.html' %}

        <div class="auth-page-root">
            <div class="auth-inner">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Theme toggle (minimal, bottom-right corner) -->
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme"
        style="position:fixed; bottom:1.5rem; right:1.5rem; z-index:999;
               background:var(--ss-card-bg); border:1px solid var(--border-bright);
               border-radius:50%; width:44px; height:44px;
               display:flex; align-items:center; justify-content:center;
               cursor:pointer; box-shadow:var(--shadow-md);">
        <i class="bi bi-moon-stars fs-5 text-ss-primary theme-icon" id="themeIcon"></i>
    </button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            [].slice.call(document.querySelectorAll('.toast')).forEach(function(el) {
                new bootstrap.Toast(el, { autohide: true, delay: 5000 }).show();
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
