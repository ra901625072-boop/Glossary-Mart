{% extends "auth_base.html" %}

{% block title %}Forgot Password - Jay Goga Mart{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="text-center mb-4">
                <a href="{{ url_for('customer.shop') }}" class="text-decoration-none d-inline-block">
                    <div class="auth-logo-text text-ss-main mb-1">
                        JAY GOGA <span class="text-ss-primary">MART</span>
                    </div>
                </a>
            </div>

            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="ss-auth-icon mx-auto bg-dark border border-ss-main border-opacity-10 mb-3">
                        <i class="bi bi-key text-ss-primary"></i>
                    </div>
                    <h2 class="fw-900 text-ss-main mb-2">Reset Password</h2>
                    <p class="text-muted smallest fw-900 text-uppercase tracking-widest">Enter email to get a reset link</p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="position-relative">
                            <span class="position-absolute top-50 start-0 translate-middle-y ps-4 text-ss-primary opacity-30"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control ps-5 ss-input" id="email" name="email" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-auth mb-4">
                        SEND RESET LINK <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </form>

                <div class="text-center pt-4 border-top border-ss-main border-opacity-5">
                    <a href="{{ url_for('auth.customer_login') }}" class="smallest fw-900 text-muted text-uppercase tracking-widest text-decoration-none auth-footer-link">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
