{% extends "auth_base.html" %}

{% block title %}Set New Password - Jay Goga Mart{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="text-center mb-4">
                <a href="{{ url_for('customer.shop') }}" class="text-decoration-none d-inline-block">
                    <div class="auth-logo-text text-ss-main mb-1">
                        JAY GOGA <span class="text-ss-primary">MART</span>
                    </div>
                </a>
            </div>

            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="ss-auth-icon mx-auto bg-dark border border-ss-main border-opacity-10 mb-3">
                        <i class="bi bi-shield-lock text-ss-primary"></i>
                    </div>
                    <h2 class="fw-900 text-ss-main mb-2">Set New Password</h2>
                    <p class="text-muted smallest fw-900 text-uppercase tracking-widest">Create a strong password</p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">New Password</label>
                        <div class="position-relative">
                            <span class="position-absolute top-50 start-0 translate-middle-y ps-4 text-ss-primary opacity-30"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control ps-5 ss-input" id="password" name="password" minlength="6" placeholder="••••••••" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <div class="position-relative">
                            <span class="position-absolute top-50 start-0 translate-middle-y ps-4 text-ss-primary opacity-30"><i class="bi bi-check2-circle"></i></span>
                            <input type="password" class="form-control ps-5 ss-input" id="confirm_password" name="confirm_password" minlength="6" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-auth">
                        UPDATE PASSWORD <i class="bi bi-check-circle-fill ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
