<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE LOGIN | JAY GOGA MART STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/2fa.css') }}">
</head>
<body class="auth-bg-secondary flex-column">
    <div class="floating-blob" style="top: 10%; left: 10%;"></div>
    <div class="floating-blob" style="bottom: 10%; right: 10%; background: var(--ss-primary);"></div>

    <div class="auth-card-glass">
        <div class="auth-brand-logo">
            <i class="bi bi-shield-lock-fill text-white fs-1"></i>
        </div>
        
        <div class="text-center mb-5">
            <h4 class="fw-900 text-white text-uppercase tracking-widest mb-1">Secure Login</h4>
            <p class="smallest fw-bold text-ss-secondary text-uppercase tracking-widest opacity-75">AUTHENTICATOR CODE REQUIRED</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} bg-opacity-10 border-0 text-{{ category }} smallest fw-bold rounded-4 mb-4">
                        <i class="bi bi-info-circle me-2"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-5 text-center">
                <label class="smallest fw-900 text-ss-secondary text-uppercase tracking-widest mb-3 d-block">Verification Code</label>
                <input type="text" class="form-control auth-form-control-glass" name="token" maxlength="6" required autofocus placeholder="0 0 0 0 0 0">
            </div>
            
            <button type="submit" class="btn btn-access-glass w-100">
                <i class="bi bi-shield-check me-2 fs-6"></i> Verify Account
            </button>
        </form>

        <div class="text-center mt-5">
            <a href="{{ url_for('auth.logout') }}" class="smallest fw-900 text-white opacity-25 text-decoration-none text-uppercase tracking-widest hover-opacity-100 transition-all">
                <i class="bi bi-x-circle me-2"></i> Cancel Login
            </a>
        </div>
    </div>
</body>
</html>
