{% if pagination and pagination.pages > 1 %}
<nav aria-label="Page navigation" class="mt-4 mb-2 animate-fade-in">
    <ul class="pagination justify-content-center gap-1 mb-0">
        <!-- Previous Page -->
        <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
            <a class="page-link rounded-circle d-flex align-items-center justify-content-center shadow-sm"
               href="{{ url_for(request.endpoint, page=pagination.prev_num, **request.args) if pagination.has_prev else '#' }}"
               style="width: 40px; height: 40px; border: none; background: var(--sur-2); color: var(--text-main);"
               aria-label="Previous">
                <i class="bi bi-chevron-left smallest"></i>
            </a>
        </li>

        <!-- Page Numbers -->
        {% for page_num in pagination.iter_pages(left_edge=1, left_current=2, right_current=3, right_edge=1) %}
            {% if page_num %}
                <li class="page-item {% if page_num == pagination.page %}active{% endif %}">
                    <a class="page-link rounded-circle d-flex align-items-center justify-content-center shadow-sm fw-900 smallest"
                       href="{{ url_for(request.endpoint, page=page_num, **request.args) }}"
                       style="width: 40px; height: 40px; border: none; 
                              {% if page_num == pagination.page %}
                                background: var(--ss-primary); color: white;
                              {% else %}
                                background: var(--sur-2); color: var(--text-main);
                              {% endif %}">
                        {{ page_num }}
                    </a>
                </li>
            {% else %}
                <li class="page-item disabled">
                    <span class="page-link rounded-circle d-flex align-items-center justify-content-center"
                          style="width: 40px; height: 40px; border: none; background: transparent; color: var(--text-muted);">
                        ...
                    </span>
                </li>
            {% endif %}
        {% endfor %}

        <!-- Next Page -->
        <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
            <a class="page-link rounded-circle d-flex align-items-center justify-content-center shadow-sm"
               href="{{ url_for(request.endpoint, page=pagination.next_num, **request.args) if pagination.has_next else '#' }}"
               style="width: 40px; height: 40px; border: none; background: var(--sur-2); color: var(--text-main);"
               aria-label="Next">
                <i class="bi bi-chevron-right smallest"></i>
            </a>
        </li>
    </ul>
</nav>
{% endif %}
